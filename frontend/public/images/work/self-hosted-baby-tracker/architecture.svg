<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="arch-title arch-desc" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif">
  <title id="arch-title">Baby tracker architecture</title>
  <desc id="arch-desc">A manual GitHub Actions deploy gets short-lived AWS credentials through OIDC, uploads the binary to an S3 bucket and sends an SSM command. The instance pulls the binary and restarts. On the instance, Caddy serves HTTPS in front of a single Go binary that uses one SQLite file, and an hourly job backs the database up to S3. Phones reach the app over HTTPS, and an uptime monitor calls a health check that fails if backups go stale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0ff"/>
    </marker>
    <style>
      .box { fill: #383836; stroke: #4c4c48; stroke-width: 1.5; }
      .frame { fill: none; stroke: #646cff; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .name { fill: #fbfff1; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #b8bcb0; font-size: 13px; text-anchor: middle; }
      .label { fill: #b8bcb0; font-size: 13px; }
      .flow { fill: none; stroke: #9aa0ff; stroke-width: 1.75; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="560" height="640" fill="#2d2d2a"/>

  <!-- Row 1: CI and credentials -->
  <rect class="box" x="20" y="20" width="220" height="60" rx="10"/>
  <text class="name" x="130" y="46">GitHub Actions</text>
  <text class="sub" x="130" y="66">manual deploy</text>

  <rect class="box" x="320" y="20" width="220" height="60" rx="10"/>
  <text class="name" x="430" y="46">AWS IAM role</text>
  <text class="sub" x="430" y="66">short-lived credentials</text>

  <path class="flow" d="M240,50 L318,50"/>
  <text class="label" x="280" y="42" text-anchor="middle">OIDC</text>

  <!-- Row 2: deploy channels -->
  <rect class="box" x="20" y="150" width="220" height="60" rx="10"/>
  <text class="name" x="130" y="176">SSM Run Command</text>
  <text class="sub" x="130" y="196">no SSH</text>

  <rect class="box" x="320" y="150" width="220" height="60" rx="10"/>
  <text class="name" x="430" y="176">S3 bucket</text>
  <text class="sub" x="430" y="196">binaries · backups</text>

  <path class="flow" d="M130,80 L130,148"/>
  <text class="label" x="140" y="120">send command</text>
  <path class="flow" d="M230,80 L338,148"/>
  <text class="label" x="300" y="110">upload binary</text>

  <!-- Instance -->
  <rect class="frame" x="20" y="270" width="520" height="200" rx="12"/>
  <text class="label" x="36" y="294">EC2 instance (ARM) · systemd</text>

  <path class="flow" d="M130,210 L130,268"/>
  <text class="label" x="140" y="245">pull &amp; restart</text>
  <path class="flow" d="M400,210 L400,268"/>
  <text class="label" x="410" y="245">binary</text>

  <rect class="box" x="40" y="320" width="140" height="60" rx="10"/>
  <text class="name" x="110" y="346">Caddy</text>
  <text class="sub" x="110" y="366">HTTPS</text>

  <rect class="box" x="210" y="320" width="140" height="60" rx="10"/>
  <text class="name" x="280" y="346">Go app</text>
  <text class="sub" x="280" y="366">single binary</text>

  <rect class="box" x="380" y="320" width="140" height="60" rx="10"/>
  <text class="name" x="450" y="346">SQLite</text>
  <text class="sub" x="450" y="366">one file</text>

  <path class="flow" d="M180,350 L208,350"/>
  <path class="flow" d="M350,350 L378,350"/>

  <rect class="box" x="380" y="400" width="140" height="50" rx="10"/>
  <text class="name" x="450" y="422">Backup job</text>
  <text class="sub" x="450" y="440">hourly</text>
  <path class="flow" d="M450,380 L450,398"/>
  <path class="flow" d="M520,425 L550,425 L550,180 L542,180"/>

  <!-- Row 4: who calls in -->
  <rect class="box" x="40" y="540" width="140" height="60" rx="10"/>
  <text class="name" x="110" y="566">Phone</text>
  <text class="sub" x="110" y="586">PWA on phone</text>

  <rect class="box" x="210" y="540" width="140" height="60" rx="10"/>
  <text class="name" x="280" y="566">Uptime monitor</text>
  <text class="sub" x="280" y="586">health check</text>

  <path class="flow" d="M110,540 L110,382"/>
  <path class="flow" d="M280,540 L280,382"/>
  <text class="label" x="360" y="566">fails if the last</text>
  <text class="label" x="360" y="584">backup is &gt; 3h old</text>

  <text class="label" x="280" y="630" text-anchor="middle">All infrastructure provisioned with Terraform</text>
</svg>
