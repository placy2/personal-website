name: Lighthouse CI

# Performance / a11y / best-practices / SEO auditing for the built site.
#
# Like pr-validate.yml this uses plain `pull_request` (NOT
# `pull_request_target`) and needs no repo secrets: results are uploaded to
# Lighthouse CI's temporary public storage (see frontend/lighthouserc.json),
# and the run URL is printed in the job summary + logs.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci
